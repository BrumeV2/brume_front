name: CI Front

on:
  push:
    branches:
      - dev
      - develop
      - main
  pull_request:
    branches:
      - dev
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Tests et Build
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dependances
        run: npm ci

      - name: Execution des tests unitaires
        run: npm test -- --no-watch

      - name: Verification du build de production
        run: npm run build

  build-and-push-staging:
    name: Build Docker et Push GHCR (Staging)
    needs: verify
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les metadonnees Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ybrume/brume_front
          tags: |
            type=raw,value=staging
            type=sha,format=short

      - name: Build et Push de l'image Docker (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploiement sur VM (Staging)
    needs: build-and-push-staging
    if: (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: [self-hosted, linux]
    steps:
      - name: Connexion au registre GHCR sur la VM
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Executer le deploiement
        run: /opt/filrouge/deploy.sh
