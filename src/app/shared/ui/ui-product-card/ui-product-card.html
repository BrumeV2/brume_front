@if (lien(); as url) {
  <a class="carte carte--lien" [routerLink]="url" [queryParams]="params()">
    <ng-container *ngTemplateOutlet="contenu" />
  </a>
} @else {
  <article class="carte">
    <ng-container *ngTemplateOutlet="contenu" />
  </article>
}

<ng-template #contenu>
  <div class="carte__photo">
    @if (photo(); as src) {
      <img [src]="src" alt="" loading="lazy" />
    }
    @if (badge(); as texte) {
      <span class="carte__badge">{{ texte }}</span>
    }
  </div>

  <div class="carte__entete">
    <h3 class="carte__nom">{{ nom() }}</h3>
    <p class="carte__prix">{{ prixCents() | price }}</p>
  </div>

  @if (origine(); as texte) {
    <p class="carte__origine">{{ texte }}</p>
  }

  @if (notes() || moment()) {
    <div class="carte__notes">
      <p>{{ notes() }}</p>
      @if (moment(); as texte) {
        <p class="carte__moment">{{ texte }}</p>
      }
    </div>
  }
</ng-template>
