<main class="compte">
  @if (user(); as u) {
    <p class="surtitre doux">Mon compte</p>
    <h1 class="titre-l">
      <span>Salut{{ u.firstName ? ' ' + u.firstName : '' }}.</span>
    </h1>
    <p class="texte-chapo doux">Connecté avec {{ u.email }}</p>

    <button class="deconnexion" type="button" [disabled]="enCours()" (click)="deconnecter()">
      {{ enCours() ? 'Déconnexion…' : 'Se déconnecter' }}
    </button>

    @if (erreur()) {
      <p class="texte-petit erreur" role="alert">
        La déconnexion n’a pas pu être confirmée. Réessaie dans un instant.
      </p>
    }
  }
</main>
