server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Repli SPA. Sans cette ligne, rafraîchir la page sur une route Angular
    # renvoie un 404 : le fichier correspondant n'existe pas sur le disque.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Angular hashe le nom de ses bundles à chaque build : ils peuvent donc
    # être mis en cache sans risque de servir une version périmée.
    location ~* \.(js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html en revanche ne doit JAMAIS être mis en cache, sinon les
    # navigateurs continuent de référencer les anciens bundles après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
